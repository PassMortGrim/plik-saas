# CI Plik-SaaS : tests automatisés à chaque push / pull request.
# Zéro dépendance npm → pas d'étape d'installation, rapide.
# Étapes séparées par groupe : si un groupe bloque/échoue, le log
# montre immédiatement lequel (diagnostic rapide).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests passerelle (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Vérification syntaxe (node --check)
        working-directory: gateway
        run: |
          set -e
          for f in src/*.js public/*.js test/*.js; do
            node --check "$f"
          done

      - name: Tests unitaires (util, store)
        working-directory: gateway
        run: node --test test/util.test.js test/store.test.js

      - name: Tests SSRF (webhooks)
        working-directory: gateway
        run: node --test test/ssrf.test.js

      - name: Tests intégration (auth, quotas, OneShot, janitor)
        working-directory: gateway
        run: node --test test/integration.test.js
